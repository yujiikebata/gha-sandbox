name: s04-permissions
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  inherits_top:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "see 'Set up job' > GITHUB_TOKEN Permissions"
  job_level:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - run: echo "see 'Set up job' > GITHUB_TOKEN Permissions"
  job_empty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "see 'Set up job' > GITHUB_TOKEN Permissions"
