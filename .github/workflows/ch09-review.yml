name: Review
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  danger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Run Danger (v9.6.2)
        uses: danger/danger@1c7b86168c352463abc2d5a7ff0313a36418aa35
        env:
          DANGER_GITHUB_API_TOKEN: ${{ github.token }}
