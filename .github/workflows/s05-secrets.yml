name: s05-secrets
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISSING: ${{ secrets.NOT_SET_ANYWHERE }}
      SPIKE: ${{ secrets.SPIKE_SECRET }}
    steps:
      - run: |
          echo "missing=[$MISSING] length=${#MISSING}"
          echo "plain: $SPIKE"
          echo "base64: $(printf %s "$SPIKE" | base64)"
          echo "reversed: $(printf %s "$SPIKE" | rev)"
          echo "first half: ${SPIKE:0:8}"
      - if: env.SPIKE != ''
        run: echo "ran: env.SPIKE is set (secret checked through env)"
