name: Draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.2.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --draft \
            --generate-notes --repo "$GITHUB_REPOSITORY"
